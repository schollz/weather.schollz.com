name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true

      - name: Install browser dependencies
        run: npm ci

      - name: Test browser application
        run: npm test

      - name: Lint browser application
        run: npm run lint

      - name: Test Go server
        run: go test ./cmd/... ./internal/...

      - name: Build Go server
        run: go build ./cmd/wthrtxt

      - name: Build container
        run: docker build --tag wthrtxt:test .

      - name: Smoke-test container
        run: |
          docker run --detach --name wthrtxt-test --publish 18080:8080 wthrtxt:test
          trap 'docker rm --force wthrtxt-test' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/healthz | grep '^ok$'
          curl --fail --silent \
            --header 'Accept: text/html' \
            --user-agent 'Mozilla/5.0' \
            http://127.0.0.1:18080/ | grep 'wthrtxt.com'
          test "$(curl --silent --output /tmp/wthrtxt-error --write-out '%{http_code}' \
            --user-agent 'curl/8.0' \
            http://127.0.0.1:18080/999,999)" = "400"
          grep '^wthrtxt.com:' /tmp/wthrtxt-error
