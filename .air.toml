root = "."
tmp_dir = "tmp"

[build]
cmd = "make build"
entrypoint = ["./wthrtxt"]
include_ext = ["go", "html", "js", "json", "mjs", "ts", "tsx", "css", "ico", "png", "svg", "webmanifest", "woff", "woff2"]
include_file = ["Makefile", "go.mod", "go.sum"]
exclude_dir = [".git", ".next", ".vinext", ".wrangler", "dist", "internal/web/public", "node_modules", "tmp"]
exclude_unchanged = true
delay = 300
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
